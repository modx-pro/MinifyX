name: CI

on:
  push:
    branches: [master, main, beta]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            composer-flags: '--prefer-lowest'
          - php: '8.2'
            composer-flags: ''
          - php: '8.3'
            composer-flags: ''
          - php: '8.4'
            composer-flags: ''
    defaults:
      run:
        working-directory: core/components/minifyx
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivamathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, mbstring, json
          coverage: none
      - name: Validate PHP syntax
        run: find src model -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist ${{ matrix.composer-flags }}
      - name: PHPUnit
        run: composer test
      - name: PHPStan
        run: composer phpstan
      - name: Composer audit
        run: composer audit
